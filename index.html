<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13110f" />
    <title>Kifu — Learn Go with clarity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <div class="brand-name">kifu<span>.</span></div>
          <button class="icon-button sidebar-close" data-action="close-sidebar" aria-label="Close navigation">×</button>
        </div>

        <div class="profile-mini">
          <div class="avatar">AM</div>
          <div>
            <strong>Alex Morgan</strong>
            <span>Level 12 · 2,840 XP</span>
          </div>
          <span class="status-dot"></span>
        </div>

        <nav class="primary-nav" aria-label="Primary navigation">
          <p class="nav-label">Workspace</p>
          <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
          <button class="nav-item" data-page="learn"><span class="nav-icon">◒</span>Learn</button>
          <button class="nav-item" data-page="practice"><span class="nav-icon">◇</span>Practice</button>
          <button class="nav-item" data-page="play"><span class="nav-icon">⌁</span>Play</button>
          <p class="nav-label nav-label-spaced">Your record</p>
          <button class="nav-item" data-page="statistics"><span class="nav-icon">◌</span>Statistics</button>
          <button class="nav-item" data-page="profile"><span class="nav-icon">◎</span>Profile</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="streak-card">
            <div class="streak-icon">✦</div>
            <div><strong>7 day streak</strong><span>Keep your rhythm going</span></div>
          </div>
          <div class="sidebar-footer"><span>v0.4.2 beta</span><button class="text-button" data-toast="Help center is coming soon">Help ↗</button></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button menu-toggle" data-action="open-sidebar" aria-label="Open navigation">☰</button>
          <div class="breadcrumbs"><span>Kifu</span><b>/</b><strong id="breadcrumb-current">Dashboard</strong></div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" data-toast="You're all caught up" aria-label="Notifications">♧<i></i></button>
            <div class="top-avatar">AM</div>
          </div>
        </header>

        <div class="page-container" id="page-container"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
      <div class="modal" id="modal"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
